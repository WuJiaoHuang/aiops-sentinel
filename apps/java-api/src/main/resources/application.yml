server:
  port: ${JAVA_API_PORT:8080}

spring:
  application:
    name: aiops-sentinel-java-api
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/aiops_sentinel?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      repositories:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

aiops:
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8787}
  auth:
    demo-username: ${DEMO_USERNAME:admin}
    demo-password: ${DEMO_PASSWORD:aiops2026}
