spring:
  datasource:
    url: jdbc:h2:mem:aiops_sentinel_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6390
      password:
      repositories:
        enabled: false

aiops:
  ai-service:
    base-url: http://localhost:8787
